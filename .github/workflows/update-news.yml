# 個別株の重大ニュース（⚠表示）を Gemini（Google検索つき）で調べて data/news.json を更新する。
# ※ Gemini の無料枠では Google 検索が使えず（429）動かないため、自動実行は止めて手動実行だけにしている。
#   いまの自動更新は Claude の定期タスク（1日2回）が担当。有料キーにしたら schedule を戻せば使える。
name: Update stock news

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-picks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Search news with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/update_news.py

      - name: Commit and push (default branch and main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then echo "No changes to commit"; exit 0; fi
          git commit -m "chore: update stock news ($(TZ=Asia/Tokyo date '+%F %H:%M'))"
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git push origin "HEAD:${branch}" && break
            git pull --rebase origin "${branch}"
          done
          git push origin HEAD:main || echo "main is out of sync; Claude will sync it on the next run"
