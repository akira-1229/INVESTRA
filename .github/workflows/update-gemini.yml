name: Update Gemini Recommendations

on:
  schedule:
    # 毎週土曜日 08:57 JST (金曜日 23:57 UTC)
    - cron: '57 23 * * 5'
  workflow_dispatch: # GitHub画面から手動でテスト実行するためのトリガー

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Gemini update script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_gemini.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gemini.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update gemini recommendations"
            git push
          fi
