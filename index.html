<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVESTRA</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07090c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo3d" aria-hidden="true"><div class="obj">
    <div class="plate p1"></div><div class="plate p2"></div>
    <div class="box main"><div class="f top"><div class="well"></div></div><div class="f s1"></div><div class="f s2"></div><div class="f s3"></div><div class="f s4"></div></div>
    <div class="box core"><div class="f top"><svg viewBox="0 0 100 100"><defs><radialGradient id="iris"><stop offset="0" stop-color="#bfffff"/><stop offset=".55" stop-color="#00e5e6"/><stop offset="1" stop-color="#05595c"/></radialGradient><linearGradient id="sclera" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#9fb0b6"/><stop offset="1" stop-color="#e9f4f6"/></linearGradient></defs><path d="M6 50 Q50 12 94 50 Q50 88 6 50Z" fill="url(#sclera)" stroke="#00e5e6" stroke-width="2"/><circle cx="50" cy="50" r="21" fill="url(#iris)"/><circle cx="50" cy="50" r="8" fill="#02090b"/><circle cx="43" cy="43" r="4" fill="#fff" opacity=".85"/></svg></div><div class="f s1"></div><div class="f s2"></div><div class="f s3"></div><div class="f s4"></div></div>
  </div></div>
  <h1>INVESTRA</h1>
  <span class="sub">4 AI ADVISORS → 最終判断は自分で</span>
  <button id="refresh" class="refresh" type="button" aria-label="最新のデータを読み込む">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M20.5 3.5v5.5H15z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <span>更新</span>
  </button>
</header>

<main>
  <div id="advisors" class="board"></div>

  <div class="lower">
    <section class="panel">
      <h2>CONSENSUS <small>複数のAIが推した銘柄</small></h2>
      <div id="consensus"></div>
    </section>
    <section class="panel">
      <h2>FINAL DECISION <small>最終的な投資先 / data/decision.json</small></h2>
      <div id="decision"></div>
    </section>
  </div>
</main>

<div id="zoom" class="zoom" hidden></div>

<footer>カードや「最終的な投資先」をタップすると、画面の約80%に拡大して表示します（詳細は拡大画面のランキングの下）。AIの推奨は情報であり、投資助言ではありません。</footer>
<script src="app.js"></script>
</body>
</html>
