<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVESTRA</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#07090c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img class="logo" src="apple-touch-icon.png" alt="" onerror="this.remove()">
  <h1>INVESTRA</h1>
  <span class="sub">4 AI ADVISORS → 最終判断は自分で</span>
</header>

<main>
  <div id="advisors" class="board"></div>

  <div class="lower">
    <section class="panel">
      <h2>CONSENSUS <small>複数のAIが推した銘柄</small></h2>
      <div id="consensus"></div>
    </section>
    <section class="panel">
      <h2>FINAL DECISION <small>最終的な投資先 / data/decision.json</small></h2>
      <div id="decision"></div>
    </section>
  </div>
</main>

<footer>銘柄をタップすると理由が開きます。AIの推奨は情報であり、投資助言ではありません。</footer>
<script src="app.js"></script>
</body>
</html>
