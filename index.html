<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVESTRA</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img class="logo" src="apple-touch-icon.png" alt="" onerror="this.remove()">
  <h1>INVESTRA</h1>
  <span class="sub">4つのAIのおすすめ → 最終判断は自分で</span>
</header>

<main>
  <div id="advisors" class="board"></div>

  <div class="lower">
    <section class="panel">
      <h2>重なり <small>複数のAIが推した銘柄</small></h2>
      <div id="consensus"></div>
    </section>
    <section class="panel">
      <h2>最終的な投資先 <small>data/decision.json</small></h2>
      <div id="decision"></div>
    </section>
  </div>
</main>

<footer>銘柄をタップすると理由が開きます。AIの推奨は情報であり、投資助言ではありません。</footer>
<script src="app.js"></script>
</body>
</html>
